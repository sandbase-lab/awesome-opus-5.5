name: sync from SandBase Lab
on:
  schedule:
    - cron: '17 23 * * *' # daily, 23:17 UTC (07:17 Beijing, after the 05:00 Beijing Lab update)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Pull the Lab collection and rebuild
        run: |
          python3 scripts/sync_lab.py
          python3 scripts/make_previews.py
          python3 scripts/build_readme.py
          python3 scripts/validate.py
      - name: Commit if anything changed
        run: |
          if git add -A previews && git diff --cached --quiet -- previews && git diff --quiet -- data docs README.md README.zh-CN.md; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs previews README.md README.zh-CN.md
          git commit -m "chore: daily sync from SandBase Lab ($(python3 -c 'import json;print(json.load(open("data/sync.json"))["count"])') videos)"
          git push
