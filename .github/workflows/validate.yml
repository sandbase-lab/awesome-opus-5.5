name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: READMEs are generated from data
        run: |
          python3 scripts/build_readme.py
          git diff --exit-code -- README.md README.zh-CN.md docs/prompts.md docs/zh-CN/prompts.md
      - name: Validate
        run: python3 scripts/validate.py
